[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumenate-nova-forensics"
version = "0.1.0"
description = "Forensic reconstruction and AVE export contracts for Lumenate Nova"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "jsonschema>=4.21,<5",
  "pytest>=8,<9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
